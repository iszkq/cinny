name: Deploy to Netlify (dev)

on:
  workflow_dispatch:
  push:
    branches:
      - dev

concurrency:
  group: netlify-dev
  cancel-in-progress: true

jobs:
  deploy-to-netlify:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    env:
      WEB_BASELINE_REF: b3197a6ce2c369a8a40143759486c739a550a38e
    defaults:
      run:
        working-directory: web-client
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Checkout unchanged Web client
        uses: actions/checkout@v6
        with:
          ref: ${{ env.WEB_BASELINE_REF }}
          path: web-client
      - name: Verify unchanged Web source and remove historical credentials
        working-directory: .
        run: node scripts/prepare-web-client.mjs web-client
      - name: Install dependencies
        run: npm ci
      - name: Build app
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: npm run build
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@4cbaf4c08f1a7bfa537d6113472ef4424e4eb654 # v3.0.0
        with:
          publish-dir: web-client/dist
          deploy-message: 'Dev deploy ${{ github.sha }}'
          enable-commit-comment: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          production-deploy: true
          github-deployment-environment: nightly
          github-deployment-description: 'Nightly deployment on each commit to dev branch'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_DEV }}
        timeout-minutes: 5
