name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: 'Build a signed release APK using the configured Android signing secrets.'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - dev
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      HUSKY: '0'
      RELEASE_SIGNING_AVAILABLE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      BUILD_SIGNED_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.build_signed_release == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Build PWA and sync Android project
        run: VITE_ANDROID_APP=true npm run android:sync

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Name debug APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Starfire-${{ github.ref_name }}-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: starfire-android-debug-${{ github.run_number }}
          path: Starfire-${{ github.ref_name }}-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release signing key
        if: env.BUILD_SIGNED_RELEASE == 'true' && env.RELEASE_SIGNING_AVAILABLE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/starfire-release.jks"

      - name: Build signed release APK
        if: env.BUILD_SIGNED_RELEASE == 'true' && env.RELEASE_SIGNING_AVAILABLE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/starfire-release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name release APK
        if: env.BUILD_SIGNED_RELEASE == 'true' && env.RELEASE_SIGNING_AVAILABLE == 'true'
        run: cp android/app/build/outputs/apk/release/app-release.apk "Starfire-${{ github.ref_name }}.apk"

      - name: Upload signed release APK
        if: env.BUILD_SIGNED_RELEASE == 'true' && env.RELEASE_SIGNING_AVAILABLE == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: starfire-android-release-${{ github.run_number }}
          path: Starfire-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach signed APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && env.RELEASE_SIGNING_AVAILABLE == 'true'
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          files: Starfire-${{ github.ref_name }}.apk
