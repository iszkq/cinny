name: Deploy GitHub Pages

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WEB_BASELINE_REF: b3197a6ce2c369a8a40143759486c739a550a38e
    defaults:
      run:
        working-directory: web-client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout unchanged Web client
        uses: actions/checkout@v6
        with:
          ref: ${{ env.WEB_BASELINE_REF }}
          path: web-client

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Verify unchanged Web source and remove historical credentials
        working-directory: .
        run: node scripts/prepare-web-client.mjs web-client

      - name: Calculate deployment base path
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO_NAME" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "APP_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "APP_BASE_PATH=/$REPO_NAME/" >> "$GITHUB_ENV"
          fi
          echo "VITE_HASH_ROUTER_ENABLED=true" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build app
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
