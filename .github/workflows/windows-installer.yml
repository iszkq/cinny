name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: npm install

      - name: Write updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          printf "%s" "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/tauri-updater.key"

      - name: Build NSIS installer
        id: tauri_build
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/tauri-updater.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --bundles nsis

      - name: Generate updater latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag '$($env:RELEASE_TAG)'. Use tags like v1.0.1, not v.1.0.1. The updater manifest version must be plain semver like 1.0.1."
          }
          $setupFile = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          $signatureFile = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe.sig' | Select-Object -First 1
          if (-not $setupFile) {
            throw 'Missing NSIS installer file under src-tauri/target/release/bundle/nsis.'
          }
          if (-not $signatureFile) {
            throw 'Missing NSIS signature file under src-tauri/target/release/bundle/nsis.'
          }

          gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --title "Starfire $($env:RELEASE_TAG)" --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub release for $($env:RELEASE_TAG)."
            }
          }

          gh release upload $env:RELEASE_TAG $setupFile.FullName $signatureFile.FullName --clobber --repo $env:RELEASE_REPOSITORY

          $signature = (Get-Content -LiteralPath $signatureFile.FullName -Raw).Trim()
          $assetName = [System.Uri]::EscapeDataString($setupFile.Name)
          $releaseMetadata = gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --json body | ConvertFrom-Json
          $releaseBody = [string]$releaseMetadata.body
          if ([string]::IsNullOrWhiteSpace($releaseBody)) {
            $releaseBody = "Starfire v$version"
          }
          $manifest = @{
            version = $version
            notes = $releaseBody
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              'windows-x86_64' = @{
                signature = $signature
                url = "https://github.com/$($env:RELEASE_REPOSITORY)/releases/download/$($env:RELEASE_TAG)/$assetName"
              }
            }
          } | ConvertTo-Json -Depth 6

          Set-Content -LiteralPath 'latest.json' -Value $manifest -Encoding utf8NoBOM
          gh release upload $env:RELEASE_TAG latest.json --clobber --repo $env:RELEASE_REPOSITORY
