name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate release version metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $packageJson = Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json
          $tauriConfig = Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $cargoToml = Get-Content -LiteralPath 'src-tauri/Cargo.toml' -Raw

          $packageVersion = [string]$packageJson.version
          $tauriVersion = [string]$tauriConfig.version
          $cargoMatch = [regex]::Match($cargoToml, '(?m)^\s*version\s*=\s*"([^"]+)"\s*$')
          if (-not $cargoMatch.Success) {
            throw 'Unable to read version from src-tauri/Cargo.toml.'
          }
          $cargoVersion = $cargoMatch.Groups[1].Value

          $versions = @($packageVersion, $tauriVersion, $cargoVersion)
          if (($versions | Select-Object -Unique).Count -ne 1) {
            throw "Version metadata is out of sync. package.json=$packageVersion, tauri.conf.json=$tauriVersion, Cargo.toml=$cargoVersion"
          }

          if ($env:RELEASE_TAG -like 'v*') {
            $tagVersion = $env:RELEASE_TAG -replace '^v', ''
            if ($tagVersion -ne $packageVersion) {
              throw "Release tag version '$tagVersion' does not match project version '$packageVersion'."
            }
          }

      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: npm install

      - name: Write updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          printf "%s" "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/tauri-updater.key"

      - name: Build NSIS installer
        id: tauri_build
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/tauri-updater.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --bundles nsis

      - name: Generate updater latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          [Console]::InputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag '$($env:RELEASE_TAG)'. Use tags like v1.0.1, not v.1.0.1. The updater manifest version must be plain semver like 1.0.1."
          }
          $setupFile = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          $signatureFile = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe.sig' | Select-Object -First 1
          $releaseNotesPath = ".github/release-notes/$($env:RELEASE_TAG).md"
          $releaseNotes = $null
          if (-not $setupFile) {
            throw 'Missing NSIS installer file under src-tauri/target/release/bundle/nsis.'
          }
          if (-not $signatureFile) {
            throw 'Missing NSIS signature file under src-tauri/target/release/bundle/nsis.'
          }
          if (Test-Path $releaseNotesPath) {
            $releaseNotes = [System.IO.File]::ReadAllText(
              (Resolve-Path $releaseNotesPath),
              [System.Text.UTF8Encoding]::new($false)
            )
          }

          gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            if (-not [string]::IsNullOrWhiteSpace($releaseNotes)) {
              gh release create $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --title "Starfire $($env:RELEASE_TAG)" --notes $releaseNotes
            } else {
              gh release create $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --title "Starfire $($env:RELEASE_TAG)" --generate-notes
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub release for $($env:RELEASE_TAG)."
            }
          } elseif (-not [string]::IsNullOrWhiteSpace($releaseNotes)) {
            gh release edit $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --title "Starfire $($env:RELEASE_TAG)" --notes $releaseNotes
          }

          gh release upload $env:RELEASE_TAG $setupFile.FullName $signatureFile.FullName --clobber --repo $env:RELEASE_REPOSITORY

          $signature = (Get-Content -LiteralPath $signatureFile.FullName -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) {
            throw "Generated updater signature file '$($signatureFile.Name)' is empty."
          }
          $assetName = [System.Uri]::EscapeDataString($setupFile.Name)
          # Prefer the release-notes file that was already decoded explicitly as UTF-8 above.
          # Reading the GitHub API response through PowerShell can decode UTF-8 Chinese as the
          # active Windows code page and write mojibake into latest.json.
          $releaseBody = $releaseNotes
          if ([string]::IsNullOrWhiteSpace($releaseBody)) {
            $releaseBody = "Starfire v$version"
          }
          $updaterNotes = $releaseBody -replace "`r`n?", "`n"
          $updaterNotes = $updaterNotes -replace '(?m)^\s{0,3}#{1,6}\s*', ''
          $updaterNotes = $updaterNotes -replace '(?m)^\s*[-*+]\s+', ''
          $updaterNotes = $updaterNotes -replace '(?m)^\s*\d+\.\s+', ''
          $updaterNotes = $updaterNotes -replace '[`*_>\[\]#]', ''
          $updaterNotes = $updaterNotes -replace '\s+', ' '
          $updaterNotes = $updaterNotes.Trim()
          if ([string]::IsNullOrWhiteSpace($updaterNotes)) {
            $updaterNotes = "Starfire v$version"
          }
          $maxNotesLength = 120
          if ($updaterNotes.Length -gt $maxNotesLength) {
            $updaterNotes = $updaterNotes.Substring(0, $maxNotesLength).TrimEnd() + "..."
          }
          $manifest = @{
            version = $version
            notes = $updaterNotes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              'windows-x86_64' = @{
                signature = $signature
                url = "https://github.com/$($env:RELEASE_REPOSITORY)/releases/download/$($env:RELEASE_TAG)/$assetName"
              }
            }
          } | ConvertTo-Json -Depth 6

          Set-Content -LiteralPath 'latest.json' -Value $manifest -Encoding utf8NoBOM
          $manifestCheck = Get-Content -LiteralPath 'latest.json' -Raw | ConvertFrom-Json
          $windowsUpdate = $manifestCheck.platforms.'windows-x86_64'
          if ([string]::IsNullOrWhiteSpace([string]$manifestCheck.version)) {
            throw 'Generated latest.json is missing version.'
          }
          if (-not $windowsUpdate) {
            throw 'Generated latest.json is missing the windows-x86_64 platform entry.'
          }
          if ([string]::IsNullOrWhiteSpace([string]$windowsUpdate.url)) {
            throw 'Generated latest.json is missing the Windows installer URL.'
          }
          if ([string]::IsNullOrWhiteSpace([string]$windowsUpdate.signature)) {
            throw 'Generated latest.json is missing the Windows updater signature.'
          }
          gh release upload $env:RELEASE_TAG latest.json --clobber --repo $env:RELEASE_REPOSITORY
